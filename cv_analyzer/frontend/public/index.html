<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Fonts from Stitch -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Public+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS (via CDN for Rapid UI injection) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "var(--color-primary)",
              "on-primary": "var(--color-on-primary)",
              "primary-container": "var(--color-primary-container)",
              "secondary": "var(--color-secondary)",
              "secondary-container": "var(--color-secondary-container)",
              "surface": "var(--color-surface)",
              "surface-variant": "var(--color-surface-variant)",
              "surface-bright": "var(--color-surface-bright)",
              "surface-container-lowest": "var(--color-surface-container-lowest)",
              "surface-container-low": "var(--color-surface-container-low)",
              "surface-container": "var(--color-surface-container)",
              "surface-container-high": "var(--color-surface-container-high)",
              "surface-container-highest": "var(--color-surface-container-highest)",
              "surface-tint": "var(--color-surface-tint)",
              "on-surface": "var(--color-on-surface)",
              "on-surface-variant": "var(--color-on-surface-variant)",
              "outline": "var(--color-outline)",
              "outline-variant": "var(--color-outline-variant)",
              "background": "var(--color-background)",
              "on-background": "var(--color-on-background)",
              "error": "var(--color-error)",
              "on-error": "var(--color-on-error)",
              "error-container": "var(--color-error-container)",
              "on-error-container": "var(--color-on-error-container)",
              "inverse-primary": "var(--color-inverse-primary)"
            },
            "fontFamily": {
              "headline": ["Space Grotesk"],
              "display": ["Space Grotesk"],
              "body": ["Inter"],
              "label": ["Public Sans"]
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-primary: #004ac6;
        --color-on-primary: #ffffff;
        --color-primary-container: #2563eb;
        --color-secondary: #495c95;
        --color-secondary-container: #acbfff;
        
        --color-surface: #faf8ff;
        --color-surface-variant: #e1e2ed;
        --color-surface-bright: #faf8ff;
        --color-surface-container-lowest: #ffffff;
        --color-surface-container-low: #f3f3fe;
        --color-surface-container: #ededf9;
        --color-surface-container-high: #e7e7f3;
        --color-surface-container-highest: #e1e2ed;
        --color-surface-tint: #0053db;
        
        --color-on-surface: #191b23;
        --color-on-surface-variant: #434655;
        --color-outline: #737686;
        --color-outline-variant: #c3c6d7;
        
        --color-background: #faf8ff;
        --color-on-background: #191b23;
        
        --color-error: #ba1a1a;
        --color-on-error: #ffffff;
        --color-error-container: #ffdad6;
        --color-on-error-container: #93000a;
        --color-inverse-primary: #b4c5ff;
      }

      .dark {
        --color-primary: #b4c5ff;
        --color-on-primary: #002978;
        --color-primary-container: #003ea8;
        --color-secondary: #b1c6ff;
        --color-secondary-container: #32447a;
        
        --color-surface: #11131a;
        --color-surface-variant: #434655;
        --color-surface-bright: #373942;
        --color-surface-container-lowest: #0a0a0f;
        --color-surface-container-low: #191b23;
        --color-surface-container: #1d1f27;
        --color-surface-container-high: #272a32;
        --color-surface-container-highest: #32353d;
        --color-surface-tint: #b4c5ff;
        
        --color-on-surface: #e1e2ed;
        --color-on-surface-variant: #c3c6d7;
        --color-outline: #8c90a2;
        --color-outline-variant: #434655;
        
        --color-background: #11131a;
        --color-on-background: #e1e2ed;
        
        --color-error: #ffb4ab;
        --color-on-error: #690005;
        --color-error-container: #93000a;
        --color-on-error-container: #ffdad6;
        --color-inverse-primary: #004ac6;
      }
      
      body {
        background-color: var(--color-background);
        color: var(--color-on-surface);
      }
    </style>
    <script>
      // Apply theme before render to prevent flash
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <title>Career Engine</title>
  </head>
  <body class="font-body text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden min-h-screen flex flex-col">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
